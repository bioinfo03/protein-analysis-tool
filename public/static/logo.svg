  <line x1="5" y1="14" x2="27" y2="14" stroke="#df3b35" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="2 2"/>
  <polyline points="5,22 9,18 12,20 15.5,9 19,19 22,16 27,21" fill="none" stroke="#13233a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="13.6,14 15.5,9 17.3,14" fill="none" stroke="#df3b35" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="11.2" y="24.5" width="8.6" height="2.6" rx="1.3" fill="#2452e0"/>
</svg>
